name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time: concurrent pushes to the build branch fail with "cannot lock ref"
concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render cv.html to PDF
        run: |
          mkdir -p github_deploy
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --no-pdf-header-footer --virtual-time-budget=10000 \
            --print-to-pdf=github_deploy/cv.pdf "file://$PWD/cv.html"
          test -s github_deploy/cv.pdf
          pages=$(python3 -c "import re,sys; print(len(re.findall(rb'/Type\s*/Page[^s]', open('github_deploy/cv.pdf','rb').read())))")
          echo "pages: $pages"
          [ "$pages" -eq 1 ] || { echo "CV must fit on one page"; exit 1; }
          cp index.html github_deploy/
      - uses: actions/upload-artifact@v4
        with:
          name: cv.pdf
          path: github_deploy/cv.pdf
      - name: Deploy to build branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github_deploy
          publish_branch: build
          force_orphan: true
